# Drop-in for Debian's systemd user unit ssh-agent.service (openssh-client);
# ssh/install-linux.sh copies it to ~/.config/systemd/user/ssh-agent.service.d/.
#
# Notify through oshirase when a security key is waiting for a touch. The
# agent has no terminal, so without this the wait is silent. The unit itself
# already sets SSH_ASKPASS_REQUIRE=force; it is repeated here so the drop-in
# does not depend on that.
[Service]
Environment=SSH_ASKPASS=%h/.local/bin/ssh-askpass-oshirase
Environment=SSH_ASKPASS_REQUIRE=force
